<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Explorer Manager</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="navigation">
        <a id="navHome" class="active" href="index.html">Home</a>
        <a id="navFeatured" href="featured.html">Featured Games</a>
        <a id="navFavorites" href="favorites.html">Favorites</a>
        <a id="navPlayed" href="played.html">Played Games</a>
        <a id="navAdmin" href="admin.html">Admin Panel</a>
        <a id="navLogin" href="login.html">Login</a>
        <a id="navRegister" href="register.html">Register</a>
        <a id="navLogout" href="#" onclick="logoutUser()">Logout</a>

        <span id="userInfo"></span>
    </div>

    <div class="container">

        <h1>Game Explorer Manager</h1>

        <div class="card">
            <h2>Featured Games</h2>

            <div id="featuredPreviewContainer" class="games-grid"></div>

            <a href="./featured.html">
                View All Featured Games
            </a>
        </div>

        <div class="card">

            <h2>Search Games</h2>

            <form id="searchForm">
                <input type="text" id="searchInput" placeholder="Search for a game..." required>
                <button type="submit">Search</button>
            </form>

        </div>

        <div id="results" class="games-grid"></div>

    </div>

    <script src="../js/config.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/games.js"></script>
    <script src="../js/favorites.js"></script>
    <script src="../js/played.js"></script>
    <script src="../js/featured.js"></script>
    <script src="../js/admin.js"></script>
    <script src="../js/app.js"></script>
    
</body>

</html>
